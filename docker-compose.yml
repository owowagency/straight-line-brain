services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitaal_brein}
      POSTGRES_USER: ${POSTGRES_USER:-brein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brein_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brein} -d ${POSTGRES_DB:-digitaal_brein}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  mcp:
    build: .
    command: python mcp_server.py --remote
    environment:
      BREIN_URL: http://api:8000
      BREIN_API_KEY: ${BREIN_API_KEY:-}
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8001"
      MCP_TRANSPORT: streamable-http
    ports:
      - "8001:8001"
    depends_on:
      - api

  chatbot-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_dev
    ports:
      - "5433:5432"
    volumes:
      - chatbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  chatbot:
    build: ./chatbot
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-e3b0c44298fc1c149afbf4c8996fb924}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MCP_SERVER_URL: http://mcp:8001/mcp
      POSTGRES_URL: postgresql://chatbot:chatbot_dev@chatbot-db:5432/chatbot
    depends_on:
      mcp:
        condition: service_started
      chatbot-db:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
  chatbot_pgdata:
