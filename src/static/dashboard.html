<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPPR Digitaal Brein</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232736;
    --border: #2e3345;
    --text: #e4e6ef;
    --text-dim: #8b8fa3;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --green: #00b894;
    --orange: #fdcb6e;
    --red: #e17055;
    --blue: #74b9ff;
    --pink: #fd79a8;
    --yellow: #ffeaa7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 1280px; margin: 0 auto; padding: 24px; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 24px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 14px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

  /* Stat cards */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .stat-card .label { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .stat-card .value { font-size: 32px; font-weight: 700; }

  /* Sections */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-header h2 { font-size: 18px; font-weight: 600; }

  /* Type groups */
  .type-group { margin-bottom: 20px; }
  .type-header {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .type-header:hover { background: var(--border); }
  .type-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  .type-count { color: var(--text-dim); font-size: 13px; margin-left: auto; }
  .type-entries { display: none; padding-left: 16px; }
  .type-entries.open { display: block; }

  /* Entry cards */
  .entry-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 8px;
  }
  .entry-card h4 { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .entry-card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .entry-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--text-dim); }

  /* Chart */
  .chart-container { position: relative; height: 500px; }
  select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  /* Loading */
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .error { text-align: center; padding: 40px; color: var(--red); }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span>UPPR</span> Digitaal Brein</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Verbinden...</span>
    </div>
  </header>

  <!-- Stat Cards -->
  <div class="stats" id="stats">
    <div class="stat-card">
      <div class="label">Kennisbank entries</div>
      <div class="value" id="totalEntries">-</div>
    </div>
    <div class="stat-card">
      <div class="label">Chunks (embedded)</div>
      <div class="value" id="totalChunks">-</div>
    </div>
    <div class="stat-card">
      <div class="label">Kennistypes</div>
      <div class="value" id="totalTypes">-</div>
    </div>
  </div>

  <!-- Knowledge Overview -->
  <div class="section">
    <div class="section-header">
      <h2>Kennisbank</h2>
    </div>
    <div id="knowledgeContent"><div class="loading">Laden...</div></div>
  </div>

  <!-- Embedding Visualization -->
  <div class="section">
    <div class="section-header">
      <h2>Embedding Space</h2>
      <select id="kindFilter" onchange="loadEmbeddings()">
        <option value="all">Alles</option>
        <option value="entries">Alleen entries</option>
        <option value="chunks">Alleen chunks</option>
      </select>
    </div>
    <div class="chart-container">
      <canvas id="scatterChart"></canvas>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
const TYPE_COLORS = {
  'bedrijfsprofiel': '#6c5ce7',
  'propositie': '#00cec9',
  'icp': '#74b9ff',
  'dienst': '#00b894',
  'tone_of_voice': '#fdcb6e',
  'werkwijze': '#e17055',
  'brand': '#fd79a8',
  'overig': '#8b8fa3',
};

function getColor(type) {
  return TYPE_COLORS[type] || '#8b8fa3';
}

let chart = null;

async function loadOverview() {
  try {
    const res = await fetch('/api/v1/dashboard/overview');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    document.getElementById('totalEntries').textContent = data.total_entries;
    document.getElementById('totalChunks').textContent = data.total_chunks;
    document.getElementById('totalTypes').textContent = data.types.length;
    document.getElementById('statusDot').style.background = '#00b894';
    document.getElementById('statusText').textContent = 'Verbonden';

    let html = '';
    for (const group of data.types) {
      const color = getColor(group.type);
      html += `
        <div class="type-group">
          <div class="type-header" onclick="this.nextElementSibling.classList.toggle('open')">
            <span class="type-badge" style="background:${color}">${group.type}</span>
            <strong>${group.type}</strong>
            <span class="type-count">${group.count} ${group.count === 1 ? 'entry' : 'entries'}</span>
          </div>
          <div class="type-entries">
            ${group.entries.map(e => `
              <div class="entry-card">
                <h4>${e.title}</h4>
                <p>${e.content_preview}</p>
                <div class="entry-meta">
                  <span>${e.chunk_count} chunks</span>
                  <span>${new Date(e.created_at).toLocaleDateString('nl-NL')}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
    document.getElementById('knowledgeContent').innerHTML = html;
  } catch (err) {
    document.getElementById('knowledgeContent').innerHTML =
      `<div class="error">Kan kennisbank niet laden: ${err.message}</div>`;
    document.getElementById('statusDot').style.background = '#e17055';
    document.getElementById('statusText').textContent = 'Fout';
  }
}

async function loadEmbeddings() {
  const kind = document.getElementById('kindFilter').value;
  try {
    const res = await fetch(`/api/v1/dashboard/embeddings?kind=${kind}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const types = [...new Set(data.points.map(p => p.type))];

    const datasets = types.map(type => ({
      label: type,
      data: data.points.filter(p => p.type === type).map(p => ({
        x: p.x, y: p.y, label: p.label, kind: p.kind, type: p.type
      })),
      backgroundColor: getColor(type) + 'cc',
      borderColor: getColor(type),
      borderWidth: 1,
      pointRadius: p => p.raw.kind === 'entry' ? 8 : 4,
      pointHoverRadius: 12,
    }));

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('scatterChart'), {
      type: 'scatter',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          tooltip: {
            callbacks: {
              label: ctx => {
                const p = ctx.raw;
                return `${p.label} (${p.kind})`;
              }
            }
          },
          legend: { display: false }
        },
        scales: {
          x: { grid: { color: '#2e334533' }, ticks: { display: false } },
          y: { grid: { color: '#2e334533' }, ticks: { display: false } }
        }
      }
    });

    // Legend
    document.getElementById('legend').innerHTML = types.map(t =>
      `<div class="legend-item"><div class="legend-dot" style="background:${getColor(t)}"></div>${t}</div>`
    ).join('');

  } catch (err) {
    console.error('Embedding error:', err);
  }
}

// Init
loadOverview();
loadEmbeddings();
</script>
</body>
</html>
