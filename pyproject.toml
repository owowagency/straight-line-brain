[project]
name = "uppr-brein"
version = "0.1.0"
description = "UPPR Digitaal Brein"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pgvector>=0.3",
    "redis>=5.0,<6.0",
    "miniopy-async>=1.21",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
